<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121824" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Registration required · Radiant Wave Technologies</title>
  <style>
    :root { --accent:#29b6e6; --cta:#ff8255; }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:radial-gradient(120% 90% at 50% -10%, #1a2742 0%, #0b0f1a 60%, #070a12 100%);
      color:#e8eef6; font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
      display:grid; place-items:center; padding:24px; text-align:center;
    }
    .card{
      width:min(480px,100%); padding:clamp(28px,5vw,46px); border-radius:22px;
      background:linear-gradient(180deg, rgba(22,18,38,.72), rgba(14,11,26,.78));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 30px 80px rgba(0,0,0,.5);
      backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
    }
    .badge{
      display:inline-block; font-size:11px; font-weight:700; letter-spacing:.2em;
      text-transform:uppercase; color:var(--accent); padding:6px 14px; border-radius:999px;
      background:rgba(41,182,230,.10); border:1px solid rgba(41,182,230,.35); margin-bottom:18px;
    }
    h1{font-size:clamp(24px,4vw,34px); margin:0 0 12px; letter-spacing:-.02em}
    p{color:#9fb0c6; line-height:1.65; margin:0 0 26px; font-size:15.5px}
    .btn{
      display:inline-block; text-decoration:none; color:#fff; font-weight:700; font-size:16px;
      padding:15px 30px; border-radius:14px;
      background:linear-gradient(135deg, var(--cta), #ff6a3d);
      box-shadow:0 14px 40px rgba(255,130,85,.4); transition:transform .15s, filter .2s;
    }
    .btn:hover{transform:translateY(-2px); filter:brightness(1.06)}
  </style>
</head>
<body>
  <div class="card">
    <span class="badge"><span></span>Private · Invitation Only</span>
    <h1>Registration required</h1>
    <p>This presentation is available to registered guests only. Please register to receive your
       private access link, then you'll be taken straight to the experience.</p>
    <a class="btn" href="https://radiantscalarwave.com/reg">Register to continue</a>
  </div>
</body>
</html>
