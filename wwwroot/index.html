<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121824" />
  <title>Radiant Wave Technologies</title>
  <meta name="description" content="A private guided experience by Radiant Wave Technologies." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Slowly drifting colour blobs -->
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob--purple"></span>
    <span class="blob blob--blue"></span>
    <span class="blob blob--pink"></span>
    <span class="blob blob--cyan"></span>
  </div>
  <!-- Animated wave + particle background -->
  <canvas id="wave-canvas" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Cinematic wave-sweep transition overlay -->
  <div id="sweep" class="sweep" aria-hidden="true"></div>

  <main id="stage" class="stage">

    <!-- ============================ WELCOME ============================ -->
    <section class="screen screen--active" data-screen="welcome">
      <div class="welcome welcome--split">
        <div class="welcome__intro">
          <div class="logo">
            <div class="logo__ring" aria-hidden="true"></div>
            <img class="logo__img" src="/assets/logo.svg" alt="Radiant Wave Technologies"
                 onerror="this.onerror=null;this.src='/assets/logo.png';" />
          </div>
          <span class="access-badge"><span class="access-badge__dot"></span>Private · Invitation Only</span>
          <h1 class="welcome__heading" data-text="welcomeHeading">Welcome to Radiant Wave Technologies</h1>
          <p class="welcome__body" data-text="welcomeBody"></p>
        </div>

        <div class="form-shell glass">
          <div id="ghl-form" class="ghl-form">
            <!-- GoHighLevel embed is injected here from server config. -->
            <div class="ghl-fallback" id="ghl-fallback">
              <p class="ghl-fallback__hint">Registration form will appear here.</p>
            </div>
          </div>
          <button id="begin-btn" class="btn btn--cta begin-btn" type="button" hidden>
            <span>Begin Experience</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ============================ VIDEO 1 ============================ -->
    <section class="screen" data-screen="video1">
      <div class="video-stage">
        <div class="player-frame">
          <div class="player-mount" id="mount-1"></div>
        </div>
      </div>
    </section>

    <!-- ============================ VIDEO 2 + DECISION ============================ -->
    <section class="screen" data-screen="video2">
      <div class="video-stage">
        <div class="player-frame">
          <div class="player-mount" id="mount-2"></div>

          <div class="reveal video-overlay video-overlay--wide decision" data-reveal="decision">
            <div class="decision__panel">
              <h2 class="decision__heading" data-text="decisionHeading">Please choose which of the following is most appealing to you:</h2>
              <div class="cards cards--3">
                <button class="card" type="button" data-option="1">
                  <span class="card__index">01</span>
                  <span class="card__text" data-text="option1"></span>
                  <span class="card__glow" aria-hidden="true"></span>
                </button>
                <button class="card" type="button" data-option="2">
                  <span class="card__index">02</span>
                  <span class="card__text" data-text="option2"></span>
                  <span class="card__glow" aria-hidden="true"></span>
                </button>
                <button class="card" type="button" data-option="3">
                  <span class="card__index">03</span>
                  <span class="card__text" data-text="option3"></span>
                  <span class="card__glow" aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================ DISQUALIFIED ============================ -->
    <section class="screen" data-screen="disqualified">
      <div class="endcard glass endcard--calm">
        <div class="endcard__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="9" />
            <path d="M8 12.5l2.5 2.5L16 9.5" opacity=".35" />
          </svg>
        </div>
        <p class="endcard__body" data-text="disqualMessage"></p>
        <button id="back-home" class="btn btn--ghost ripple" type="button">Back to Home</button>
      </div>
    </section>

    <!-- ============================ QUALIFY (congrats + valuation) ============================ -->
    <section class="screen" data-screen="qualify">
      <div class="qualify">
        <span class="qualify__eyebrow">You're Qualified</span>
        <h2 class="qualify__title">Congratulations!</h2>
        <p class="qualify__intro" data-text="congratsMessage"></p>

        <div class="question qcard" data-question="1">
          <span class="question__num">Question 1 of 2</span>
          <h3 class="question__label" data-text="valuationQ1"></h3>
          <div class="cards cards--4 value-cards" data-value-group="q1">
            <button class="card card--value" type="button" data-value="$10,000"><span class="card__text">$10,000</span><span class="card__glow" aria-hidden="true"></span></button>
            <button class="card card--value" type="button" data-value="$100,000"><span class="card__text">$100,000</span><span class="card__glow" aria-hidden="true"></span></button>
            <button class="card card--value" type="button" data-value="$1,000,000"><span class="card__text">$1,000,000</span><span class="card__glow" aria-hidden="true"></span></button>
            <button class="card card--value" type="button" data-value="Priceless"><span class="card__text">Priceless</span><span class="card__glow" aria-hidden="true"></span></button>
          </div>
        </div>

        <div class="question qcard is-collapsed" data-question="2">
          <span class="question__num">Question 2 of 2</span>
          <h3 class="question__label" data-text="valuationQ2"></h3>
          <div class="cards cards--4 value-cards" data-value-group="q2">
            <button class="card card--value" type="button" data-value="$10,000"><span class="card__text">$10,000</span><span class="card__glow" aria-hidden="true"></span></button>
            <button class="card card--value" type="button" data-value="$100,000"><span class="card__text">$100,000</span><span class="card__glow" aria-hidden="true"></span></button>
            <button class="card card--value" type="button" data-value="$1,000,000"><span class="card__text">$1,000,000</span><span class="card__glow" aria-hidden="true"></span></button>
            <button class="card card--value" type="button" data-value="Priceless"><span class="card__text">Priceless</span><span class="card__glow" aria-hidden="true"></span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================ VIDEO 3 + FINAL CTA ============================ -->
    <section class="screen" data-screen="video3">
      <div class="video-stage">
        <div class="player-frame">
          <div class="player-mount" id="mount-3"></div>
          <div class="reveal video-overlay" data-reveal="final-cta">
            <button id="final-cta" class="btn btn--cta btn--xl ripple" type="button" data-text="video3Cta">Continue to Radiant Wave Technologies</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="loader" class="loader">
    <div class="loader__bolt" aria-hidden="true">
      <span class="loader__ring"></span>
      <span class="loader__ring loader__ring--2"></span>
      <span class="loader__arc"></span>
      <svg class="loader__icon" viewBox="0 0 24 24">
        <path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"/>
      </svg>
    </div>
    <span class="loader__label">Energizing…</span>
  </div>

  <script src="/js/waves.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
